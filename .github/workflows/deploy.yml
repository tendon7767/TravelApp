name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # GitHub Pages 的網址是 https://<帳號>.github.io/<repo>/，所以 base 要帶 repo 名稱
      - run: GITHUB_PAGES_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build
      # enablement 讓 workflow 自己把 Pages 開起來，
      # 不然第一次跑會因為「Pages 尚未啟用」直接 404 失敗。
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
