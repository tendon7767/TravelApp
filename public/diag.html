<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161b22" />
    <title>狀態列診斷</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: calc(12px + env(safe-area-inset-top)) 14px 40px;
        background: #161b22;
        color: #f0f6fc;
        font: 15px/1.7 system-ui, -apple-system, "Noto Sans TC", sans-serif;
        overflow-x: hidden;
      }
      h1 { font-size: 17px; margin: 0 0 12px; }
      table { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
      td { padding: 5px 0; border-bottom: 1px solid #30363d; vertical-align: top; overflow-wrap: anywhere; }
      td:first-child { width: 42%; color: #9198a1; font-size: 13px; }
      td:last-child { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
      .big { font-size: 20px; font-weight: 700; color: #3fb950; }
      h2 { font-size: 14px; margin: 20px 0 8px; color: #9198a1; }
      .btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      button {
        padding: 12px 8px; border: 1px solid #30363d; border-radius: 8px;
        background: #21262d; color: #f0f6fc; font: inherit;
      }
      p.note { color: #9198a1; font-size: 13px; }
    </style>
  </head>
  <body>
    <p style="margin:0 0 10px"><a href="./" style="color:#58a6ff;text-decoration:none">← 回到 App</a></p>
      <h1>狀態列診斷</h1>
    <table>
      <tr><td>安全區上緣<br />safe-area-inset-top</td><td><span id="top" class="big">?</span></td></tr>
      <tr><td>安全區下緣</td><td id="bottom">?</td></tr>
      <tr><td>顯示模式</td><td id="mode">?</td></tr>
      <tr><td>系統深淺色</td><td id="scheme">?</td></tr>
      <tr><td>視窗高度</td><td id="size">?</td></tr>
      <tr><td>瀏覽器</td><td id="ua">?</td></tr>
    </table>

    <h2>換狀態列顏色測試</h2>
    <p class="note">每按一顆，看最上面那排「時間、電量」有沒有變得看得見。把看得見的那幾顆告訴我。</p>
    <div class="btns">
      <button data-c="#161b22">深灰（現在這個）</button>
      <button data-c="#000000">純黑</button>
      <button data-c="#ffffff">純白</button>
      <button data-c="#ff0000">紅色</button>
      <button data-c="">整個拿掉</button>
      <button data-bg="1">只換頁面底色</button>
    </div>
    <p class="note" id="now"></p>

    <script>
      const px = (v) => {
        const probe = document.createElement('div')
        probe.style.cssText = `position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-${v});`
        document.body.appendChild(probe)
        const h = probe.getBoundingClientRect().height
        probe.remove()
        return h
      }
      document.getElementById('top').textContent = px('top') + ' px'
      document.getElementById('bottom').textContent = px('bottom') + ' px'
      document.getElementById('mode').textContent =
        ['standalone', 'fullscreen', 'minimal-ui', 'browser']
          .find((m) => matchMedia(`(display-mode: ${m})`).matches) ?? '未知'
      document.getElementById('scheme').textContent =
        matchMedia('(prefers-color-scheme: dark)').matches ? '深色' : '亮色'
      document.getElementById('size').textContent =
        `${innerWidth} × ${innerHeight}（螢幕 ${screen.width} × ${screen.height}）`
      document.getElementById('ua').textContent = navigator.userAgent

      const meta = document.querySelector('meta[name="theme-color"]')
      const show = () => {
        document.getElementById('now').textContent =
          `目前 theme-color：${meta.getAttribute('content') || '（沒有）'}　頁面底色：${getComputedStyle(document.body).backgroundColor}`
      }
      show()
      let alt = false
      for (const btn of document.querySelectorAll('button')) {
        btn.addEventListener('click', () => {
          if (btn.dataset.bg) {
            alt = !alt
            document.body.style.background = alt ? '#ffffff' : '#161b22'
            document.body.style.color = alt ? '#111' : '#f0f6fc'
          } else {
            meta.setAttribute('content', btn.dataset.c)
          }
          show()
        })
      }
    </script>
  </body>
</html>
