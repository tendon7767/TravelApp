<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>批次匯入 · TravelApp</title>
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface-2: #21262d;
        --text: #f0f6fc;
        --muted: #9198a1;
        --line: #30363d;
        --accent: #f0f6fc;
        --ok: #3fb950;
        --err: #f85149;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px 16px 40px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.6 system-ui, -apple-system, "Noto Sans TC", sans-serif;
        overflow-x: hidden;
      }
      main { max-width: 560px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.lead { color: var(--muted); margin: 0 0 20px; }
      section {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 14px;
      }
      h2 { font-size: 15px; margin: 0 0 10px; }
      label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
      textarea, input, select {
        width: 100%;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        font: inherit;
        overflow-wrap: anywhere;
      }
      textarea { min-height: 96px; resize: vertical; }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--text);
        font: inherit;
        font-weight: 600;
      }
      button.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); }
      button:disabled { opacity: 0.5; }
      .row {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      .row:last-child { border-bottom: 0; }
      .tag {
        flex: none;
        font-size: 12px;
        padding: 1px 7px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .tag.new { color: var(--ok); border-color: var(--ok); }
      .tag.upd { color: var(--muted); }
      #summary { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
      #log { margin-top: 14px; font-size: 13px; }
      .line { color: var(--muted); padding: 2px 0; overflow-wrap: anywhere; }
      .line.ok { color: var(--ok); }
      .line.err { color: var(--err); }
    </style>
  </head>
  <body>
    <main>
      <h1>批次匯入</h1>
      <p class="lead">把整理好的由布院店家一次寫進試算表。寫完回 App 同步一次就看得到。</p>

      <section>
        <h2>1 · 貼上邀請連結</h2>
        <label for="invite">那一趟的邀請連結（整段貼上，密鑰只留在這個分頁裡，不會送去別的地方）</label>
        <textarea id="invite" placeholder="https://…/#/join?u=…&s=…&k=…" spellcheck="false"></textarea>
        <button id="load">讀取行程</button>
      </section>

      <section id="step2" hidden>
        <h2>2 · 確認</h2>
        <label for="plan">寫進哪一版</label>
        <select id="plan"></select>
        <label for="author">記成誰改的</label>
        <input id="author" type="search" value="AI 查詢" enterkeyhint="done" />
        <label>要寫的內容</label>
        <div id="preview"></div>
        <p id="summary"></p>
        <button id="write" class="primary">寫入試算表</button>
      </section>

      <div id="log"></div>
    </main>
    <script type="module" src="/src/import/main.ts"></script>
  </body>
</html>
